resources:
  jobs:
    transfer_portal_lakehouse:
      name: cfb-transfer-portal-lakehouse
      queue:
        enabled: true
      tasks:
        - task_key: bronze_manifest
          notebook_task:
            notebook_path: ../databricks/notebooks/01_bronze_manifest.py
            base_parameters:
              manifest_path: ${var.manifest_path}
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: silver_resolutions
          depends_on:
            - task_key: bronze_manifest
          notebook_task:
            notebook_path: ../databricks/notebooks/02_silver_resolutions.py
            base_parameters:
              resolutions_path: ${var.resolutions_path}
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: gold_resolver_accounting
          depends_on:
            - task_key: silver_resolutions
          notebook_task:
            notebook_path: ../databricks/notebooks/03_gold_resolver_accounting.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: silver_player_season_bridge
          depends_on:
            - task_key: gold_resolver_accounting
          notebook_task:
            notebook_path: ../databricks/notebooks/04_silver_player_season_bridge.py
            base_parameters:
              bridge_path: ${var.bridge_path}
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: silver_player_stats_long
          depends_on:
            - task_key: silver_player_season_bridge
          notebook_task:
            notebook_path: ../databricks/notebooks/05_silver_player_stats_long.py
            base_parameters:
              stats_path: ${var.stats_path}
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: gold_player_production_feature_matrix
          depends_on:
            - task_key: silver_player_stats_long
          notebook_task:
            notebook_path: ../databricks/notebooks/06_gold_player_production_feature_matrix.py
            base_parameters:
              feature_matrix_path: ${var.feature_matrix_path}
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: gold_player_outcome_observed_modeling_v2
          depends_on:
            - task_key: gold_player_production_feature_matrix
          notebook_task:
            notebook_path: ../databricks/notebooks/07_gold_player_outcome_observed_modeling_v2.py
            base_parameters:
              outcome_modeling_v2_path: ${var.outcome_modeling_v2_path}
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: gold_player_predictions_2026_v2
          depends_on:
            - task_key: gold_player_outcome_observed_modeling_v2
          notebook_task:
            notebook_path: ../databricks/notebooks/08_gold_player_predictions_2026_v2.py
            base_parameters:
              scoring_cohort_2026_v2_path: ${var.scoring_cohort_2026_v2_path}
              scoring_exclusions_2026_v2_path: ${var.scoring_exclusions_2026_v2_path}
              predictions_2026_v2_path: ${var.predictions_2026_v2_path}
              predictions_2026_v2_summary_path: ${var.predictions_2026_v2_summary_path}
              catalog: ${var.catalog}
              schema: ${var.schema}
        - task_key: gold_player_predictions_2026_v2_presentation
          depends_on:
            - task_key: gold_player_predictions_2026_v2
          notebook_task:
            notebook_path: ../databricks/notebooks/09_gold_player_predictions_2026_v2_presentation.py
            base_parameters:
              predictions_2026_v2_presentation_path: ${var.predictions_2026_v2_presentation_path}
              predictions_2026_v2_presentation_summary_path: ${var.predictions_2026_v2_presentation_summary_path}
              catalog: ${var.catalog}
              schema: ${var.schema}
