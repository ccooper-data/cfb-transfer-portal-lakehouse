bundle:
  name: cfb-transfer-portal-lakehouse

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog.
    default: workspace
  schema:
    description: Unity Catalog schema.
    default: cfb_transfer_portal
  manifest_path:
    description: Workspace/Volume path to exported raw_manifest.jsonl.
  resolutions_path:
    description: Workspace/Volume path to resolutions JSONL.
  bridge_path:
    description: Workspace/Volume path to resolved player-season bridge JSONL.
  stats_path:
    description: Workspace/Volume path to resolved long-form player stats JSONL.
  feature_matrix_path:
    description: Workspace/Volume path to full player production feature matrix JSONL.
  outcome_modeling_v2_path:
    description: Workspace/Volume path to the v2 outcome-observed modeling CSV.
  scoring_cohort_2026_v2_path:
    description: Workspace/Volume path to the frozen 2026 v2 scoring cohort CSV.
  scoring_exclusions_2026_v2_path:
    description: Workspace/Volume path to the frozen 2026 v2 scoring exclusions CSV.
  predictions_2026_v2_path:
    description: Workspace/Volume path to the frozen first 2026 v2 predictions CSV.
  predictions_2026_v2_summary_path:
    description: Workspace/Volume path to the frozen first 2026 v2 prediction summary JSON.
  predictions_2026_v2_presentation_path:
    description: Workspace/Volume path to the frozen first 2026 v2 presentation CSV.
  predictions_2026_v2_presentation_summary_path:
    description: Workspace/Volume path to the frozen first 2026 v2 presentation summary JSON.

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
